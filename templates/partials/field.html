<div class="field">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="check-row">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text and show_help %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
</div>
