{% if page.has_other_pages %}
<nav class="pager" aria-label="Pages">
  {% if page.has_previous %}<a class="btn secondary sm" href="?{% if q %}q={{ q|urlencode }}&amp;{% endif %}page={{ page.previous_page_number }}"><i class="ph-bold ph-caret-left" aria-hidden="true"></i> Previous</a>{% else %}<span></span>{% endif %}
  <span class="muted small">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn secondary sm" href="?{% if q %}q={{ q|urlencode }}&amp;{% endif %}page={{ page.next_page_number }}">Next <i class="ph-bold ph-caret-right" aria-hidden="true"></i></a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
