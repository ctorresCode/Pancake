{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong | Pancake</title>
  <link rel="icon" href="{% static 'img/pancake.svg' %}" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/pancake.css' %}">
</head>
<body>
  <main><div class="container">
    <div class="card empty error-page">
      <img src="{% static 'img/pancake.svg' %}" alt="" width="120" height="120">
      <h1>Something went wrong</h1>
      <p class="muted">It's not your fault. Wait a moment and try again.</p>
      <a class="btn" href="/">Back to Pancake</a>
    </div>
  </div></main>
</body>
</html>
